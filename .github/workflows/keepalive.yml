name: Keep Render Backend Warm

on:
  schedule:
    # Trigger every 10 minutes to prevent Render free instance from sleeping
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping LeakTrace Backend Health
        run: |
          echo "Pinging LeakTrace central backend..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://leaktrace-backend.onrender.com/health")
          echo "Received HTTP status: $STATUS"
          if [ "$STATUS" -eq 200 ]; then
            echo "Render backend is healthy and warm!"
          else
            echo "Unexpected status $STATUS, checking root endpoint..."
            curl -I "https://leaktrace-backend.onrender.com/"
          fi
